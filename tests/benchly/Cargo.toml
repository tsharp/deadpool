[package]
name = "benchly"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0"
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
deadpool = { path = "../../crates/deadpool", features = ["rt_tokio_1"] }
deadpool-postgres = { path = "../../crates/deadpool-postgres", features = ["serde"] }
tokio-postgres = { version = "0.7.10", features = ["with-serde_json-1", "with-uuid-1"] }
openssl = { version = "0.10", features = ["vendored"] }
postgres-openssl = "0.5"
dotenvy = "0.15.7"
uuid = { version = "1.8.0", features = ["serde"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
config = "0.15.0"
hdrhistogram = "7.5"
